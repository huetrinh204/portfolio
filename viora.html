<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO -->
  <title>VIORA Case Study — Thạch Thị Huệ Trinh</title>
  <meta name="description"
    content="Deep dive into VIORA — a mobile healthy lifestyle app built with Flutter, Node.js, and Gemini AI. Graduation project by Thạch Thị Huệ Trinh.">

  <!-- Open Graph -->
  <meta property="og:title" content="VIORA Case Study — Thạch Thị Huệ Trinh">
  <meta property="og:description"
    content="Deep dive into VIORA — a mobile healthy lifestyle app built with Flutter, Node.js, and Gemini AI. Graduation project by Thạch Thị Huệ Trinh.">

  <meta property="og:type" content="website">

  <!-- Google Fonts — preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind config must come BEFORE cdn.tailwindcss.com -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent:        '#6366F1',
            'accent-hover':'#4F46E5',
            'accent-light':'#EEF2FF',
          },
          fontFamily: {
            display: ['Plus Jakarta Sans', 'sans-serif'],
            body:    ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Case study hero */
    .case-study-hero {
      background: linear-gradient(135deg, #6366F1 0%, #a5b4fc 100%);
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 4rem;
    }

    /* Stack pill in hero */
    .hero-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.875rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 0.875rem;
      font-family: var(--font-body);
      font-weight: 500;
    }

    /* Feature card in key features grid */
    .feature-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      transition: box-shadow 200ms ease, border-color 200ms ease;
    }

    .feature-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border-color: var(--color-accent);
    }

    /* Architecture pre block */
    .arch-pre {
      background: #F9FAFB;
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8125rem;
      line-height: 1.6;
      color: var(--color-text-primary);
      white-space: pre;
    }

    /* Tier cards */
    .tier-card {
      background: var(--color-accent-light);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
    }

    /* Challenge/solution pair */
    .challenge-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-accent);
      margin-bottom: 0.25rem;
    }

    .solution-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #059669;
      margin-bottom: 0.25rem;
    }

    /* Lesson card */
    .lesson-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      transition: box-shadow 200ms ease;
    }

    .lesson-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    /* Metrics table */
    .metrics-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }

    .metrics-table th {
      text-align: left;
      padding: 0.75rem 1rem;
      background: #F9FAFB;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-secondary);
      border-bottom: 1px solid var(--color-border);
    }

    .metrics-table td {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      vertical-align: top;
    }

    .metrics-table tr:last-child td {
      border-bottom: none;
    }

    .metrics-table td:first-child {
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .metrics-table td .placeholder {
      display: inline-block;
      background: #F3F4F6;
      color: #9CA3AF;
      font-size: 0.8125rem;
      border-radius: 4px;
      padding: 0.125rem 0.5rem;
    }

    /* DB table list */
    .db-table-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1.25rem;
      padding: 0.875rem 0;
      border-bottom: 1px solid var(--color-border);
      align-items: baseline;
    }

    .db-table-item:last-child {
      border-bottom: none;
    }

    .db-table-name {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-accent);
      white-space: nowrap;
      padding: 0.125rem 0.5rem;
      background: var(--color-accent-light);
      border-radius: 4px;
    }

    /* User flow step */
    .flow-step {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 0.875rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    .flow-step:last-child {
      border-bottom: none;
    }

    .flow-step-number {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--color-accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125rem;
      font-weight: 700;
      font-family: var(--font-display);
    }

    /* Route group */
    .route-group {
      background: #F9FAFB;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .route-group-header {
      background: #F3F4F6;
      padding: 0.5rem 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-accent);
      border-bottom: 1px solid var(--color-border);
    }

    .route-group-body {
      padding: 0.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }

    .route-tag {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 0.125rem 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Skip to main content (keyboard navigation) -->
  <a href="#main-content" class="skip-link" data-i18n="viora.skipLink">Skip to main content</a>

  <!-- =====================================================================
       NAVIGATION — simplified, back button only
       ===================================================================== -->
  <header>
    <nav class="nav-bar" id="site-nav" aria-label="Site navigation">
      <div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
        <a href="index.html"
           class="font-display font-extrabold text-lg tracking-tight text-[#0F0F0F] hover:text-accent transition-colors">
          Huệ Trinh
        </a>
        <div id="case-study-nav-actions" class="flex items-center gap-4">
          <a href="index.html#projects" class="btn-ghost text-sm flex items-center gap-1" data-i18n="viora.backPortfolio">
            ← Back to Portfolio
          </a>
        </div>
      </div>
    </nav>
  </header>

  <!-- =====================================================================
       MAIN CONTENT
       ===================================================================== -->
  <main id="main-content">

    <!-- Case Study Hero -->
    <section class="case-study-hero" id="viora-hero" aria-label="VIORA case study hero">
      <div class="max-w-4xl mx-auto text-center">
        <span class="block text-sm font-semibold tracking-widest uppercase mb-3"
              style="color: rgba(255,255,255,0.7);" data-i18n="viora.heroEyebrow">Case Study 01</span>

        <h1 class="font-display font-extrabold text-white mb-3"
            style="font-size: clamp(3rem, 7vw, 5.5rem); line-height: 1.1;">
          VIORA
        </h1>

        <p class="text-lg font-medium mb-6"
           style="color: rgba(255,255,255,0.9);" data-i18n="viora.heroSubtitle">
          Graduation Project — Healthy Lifestyle App
        </p>

        <!-- Stack pills -->
        <div id="viora-stack-list" class="flex flex-wrap justify-center gap-2 mb-5" role="list" aria-label="Technology stack">
          <span class="hero-pill" role="listitem">Flutter</span>
          <span class="hero-pill" role="listitem">Node.js</span>
          <span class="hero-pill" role="listitem">MySQL</span>
          <span class="hero-pill" role="listitem">Gemini AI</span>
          <span class="hero-pill" role="listitem">Firebase Cloud Messaging</span>
          <span class="hero-pill" role="listitem">Google OAuth</span>
        </div>

        <!-- Role line -->
        <p class="text-sm font-medium" style="color: rgba(255,255,255,0.8);" data-i18n="viora.heroRole">
          Role: Full Stack Developer &amp; UI/UX Designer
        </p>
      </div>
    </section>

    <!-- 14 content sections — rendered by inline script below -->
    <div id="viora-sections"></div>

  </main>

  <!-- =====================================================================
       FOOTER
       ===================================================================== -->
  <footer class="bg-white border-t border-[#E5E7EB] py-8 text-center">
    <p class="text-sm text-muted">&copy; 2026 Thạch Thị Huệ Trinh</p>
    <p class="text-sm mt-2">
      <a href="index.html#projects" class="text-accent hover:underline" data-i18n="viora.backPortfolio">← Back to Portfolio</a>
    </p>
  </footer>

  <!-- =====================================================================
       SCRIPTS
       ===================================================================== -->
  <script src="data/content.js" defer></script>
  <script src="data/i18n.js" defer></script>
  <script src="data/i18n-viora.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/viora-page.js" defer></script>
  <script src="js/i18n.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      var nav = document.getElementById('site-nav');
      window.addEventListener('scroll', function () {
        if (window.scrollY > 20) {
          nav.classList.add('scrolled');
        } else {
          nav.classList.remove('scrolled');
        }
      }, { passive: true });

      if (typeof window.initI18n === 'function') {
        window.initI18n();
      } else if (typeof window.renderVioraCaseStudy === 'function') {
        window.renderVioraCaseStudy();
        if (typeof window.initReveal === 'function') window.initReveal();
      }

    });
  </script>

</body>
</html>

        wrap.appendChild(bodyP(d.description));

        var tableList = el('div',
          'mt-6 border border-[#E5E7EB] rounded-xl overflow-hidden divide-y divide-[#E5E7EB]');
        d.tables.forEach(function (tbl) {
          var row = el('div', 'db-table-item px-4');
          var nameEl = el('span', 'db-table-name');
          nameEl.textContent = tbl.name;
          var desc = el('span', 'text-[#4B5563] text-sm');
          desc.style.lineHeight = 'var(--leading-normal)';
          desc.textContent = tbl.description;
          row.appendChild(nameEl);
          row.appendChild(desc);
          tableList.appendChild(row);
        });
        wrap.appendChild(tableList);
        container.appendChild(section(nextBg(), wrap));
      })();

      // ------------------------------------------------------------------
      // 10. API / Backend
      // ------------------------------------------------------------------
      (function () {
        var d = data.backend;
        var wrap = el('div');
        wrap.appendChild(eyebrow('API & Backend'));
        wrap.appendChild(sectionTitle(d.title));
        wrap.appendChild(bodyP(d.description));

        var patternsTitle = el('h3', 'font-display font-semibold mt-6 mb-3 text-[#0F0F0F]');
        patternsTitle.style.fontSize = 'var(--text-h4)';
        patternsTitle.textContent = 'Patterns';
        wrap.appendChild(patternsTitle);

        var ul = el('ul', 'space-y-2 mb-8');
        d.patterns.forEach(function (p) {
          var li = el('li', 'flex items-start gap-2');
          var dot = el('span', 'flex-shrink-0 mt-1', '');
          dot.style.width = '6px';
          dot.style.height = '6px';
          dot.style.borderRadius = '50%';
          dot.style.background = 'var(--color-accent)';
          dot.style.marginTop = '7px';
          var t = el('span', 'text-[#4B5563] text-sm');
          t.style.lineHeight = 'var(--leading-normal)';
          t.textContent = p;
          li.appendChild(dot);
          li.appendChild(t);
          ul.appendChild(li);
        });
        wrap.appendChild(ul);

        var routesTitle = el('h3', 'font-display font-semibold mb-4 text-[#0F0F0F]');
        routesTitle.style.fontSize = 'var(--text-h4)';
        routesTitle.textContent = 'Route Groups';
        wrap.appendChild(routesTitle);

        d.routeGroups.forEach(function (group) {
          var rg = el('div', 'route-group');
          var hdr = el('div', 'route-group-header');
          hdr.textContent = '/api/v1' + group.prefix;
          var body = el('div', 'route-group-body');
          group.endpoints.forEach(function (ep) {
            var tag = el('span', 'route-tag');
            tag.textContent = ep;
            body.appendChild(tag);
          });
          rg.appendChild(hdr);
          rg.appendChild(body);
          wrap.appendChild(rg);
        });

        container.appendChild(section(nextBg(), wrap));
      })();

      // ------------------------------------------------------------------
      // 11. AI Integration
      // ------------------------------------------------------------------
      (function () {
        var d = data.aiIntegration;
        var wrap = el('div');
        wrap.appendChild(eyebrow('AI Integration'));
        wrap.appendChild(sectionTitle(d.title));
        wrap.appendChild(bodyP(d.description));

        var featuresGrid = el('div', 'grid sm:grid-cols-2 gap-4 mt-6');

        [d.chatbot, d.behaviourAnalysis].forEach(function (feat) {
          var card = el('div', 'feature-card');
          var name = el('p', 'font-semibold text-[#0F0F0F] text-sm mb-2');
          name.textContent = feat.name;
          var detail = el('p', 'text-[#4B5563] text-sm');
          detail.style.lineHeight = 'var(--leading-normal)';
          detail.textContent = feat.detail;
          card.appendChild(name);
          card.appendChild(detail);
          featuresGrid.appendChild(card);
        });
        wrap.appendChild(featuresGrid);

        var implTitle = el('h3', 'font-display font-semibold mt-8 mb-3 text-[#0F0F0F]');
        implTitle.style.fontSize = 'var(--text-h4)';
        implTitle.textContent = 'Implementation Notes';
        wrap.appendChild(implTitle);

        var ul = el('ul', 'space-y-2');
        d.implementation.forEach(function (note) {
          var li = el('li', 'flex items-start gap-2');
          var dot = el('span', 'flex-shrink-0', '');
          dot.style.width = '6px';
          dot.style.height = '6px';
          dot.style.borderRadius = '50%';
          dot.style.background = 'var(--color-accent)';
          dot.style.marginTop = '7px';
          dot.style.flexShrink = '0';
          var t = el('span', 'text-[#4B5563] text-sm');
          t.style.lineHeight = 'var(--leading-normal)';
          t.textContent = note;
          li.appendChild(dot);
          li.appendChild(t);
          ul.appendChild(li);
        });
        wrap.appendChild(ul);

        container.appendChild(section(nextBg(), wrap));
      })();

      // ------------------------------------------------------------------
      // 12. Challenges & Solutions
      // ------------------------------------------------------------------
      (function () {
        var d = data.challenges;
        var wrap = el('div');
        wrap.appendChild(eyebrow('Challenges'));
        wrap.appendChild(sectionTitle(d.title));

        var list = el('div', 'space-y-6 mt-2');
        d.items.forEach(function (item, idx) {
          var pair = el('div',
            'border border-[#E5E7EB] rounded-xl overflow-hidden');

          var challengeBlock = el('div', 'px-5 py-4');
          challengeBlock.style.borderBottom = '1px solid var(--color-border)';
          var cLabel = el('p', 'challenge-label', 'Challenge ' + (idx + 1));
          var cText = el('p', 'text-[#0F0F0F] text-sm font-medium');
          cText.style.lineHeight = 'var(--leading-normal)';
          cText.textContent = item.challenge;
          challengeBlock.appendChild(cLabel);
          challengeBlock.appendChild(cText);

          var solutionBlock = el('div', 'px-5 py-4');
          solutionBlock.style.background = '#F0FDF4';
          var sLabel = el('p', 'solution-label', 'Solution');
          var sText = el('p', 'text-[#374151] text-sm');
          sText.style.lineHeight = 'var(--leading-normal)';
          sText.textContent = item.solution;
          solutionBlock.appendChild(sLabel);
          solutionBlock.appendChild(sText);

          pair.appendChild(challengeBlock);
          pair.appendChild(solutionBlock);
          list.appendChild(pair);
        });
        wrap.appendChild(list);
        container.appendChild(section(nextBg(), wrap));
      })();

      // ------------------------------------------------------------------
      // 13. Outcome
      // ------------------------------------------------------------------
      (function () {
        var d = data.outcome;
        var wrap = el('div');
        wrap.appendChild(eyebrow('Outcome'));
        wrap.appendChild(sectionTitle(d.title));
        wrap.appendChild(bodyP(d.summary));

        var delivTitle = el('h3', 'font-display font-semibold mt-6 mb-3 text-[#0F0F0F]');
        delivTitle.style.fontSize = 'var(--text-h4)';
        delivTitle.textContent = 'Deliverables';
        wrap.appendChild(delivTitle);

        var ul = el('ul', 'space-y-2 mb-8');
        d.deliverables.forEach(function (item) {
          var li = el('li', 'flex items-start gap-3');
          var bullet = el('span',
            'flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center mt-0.5',
            '');
          bullet.style.background = 'var(--color-accent)';
          var icon = el('svg');
          icon.setAttribute('viewBox', '0 0 12 12');
          icon.setAttribute('width', '10');
          icon.setAttribute('height', '10');
          icon.setAttribute('fill', 'none');
          icon.setAttribute('aria-hidden', 'true');
          icon.innerHTML = '<polyline points="2,6 5,9 10,3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
          bullet.appendChild(icon);
          var t = el('span', 'text-[#4B5563] text-sm');
          t.style.lineHeight = 'var(--leading-normal)';
          t.textContent = item;
          li.appendChild(bullet);
          li.appendChild(t);
          ul.appendChild(li);
        });
        wrap.appendChild(ul);

        var metricsTitle = el('h3', 'font-display font-semibold mb-3 text-[#0F0F0F]');
        metricsTitle.style.fontSize = 'var(--text-h4)';
        metricsTitle.textContent = 'Metrics';
        wrap.appendChild(metricsTitle);

        var tableWrap = el('div', 'border border-[#E5E7EB] rounded-xl overflow-hidden');
        var table = el('table', 'metrics-table');
        table.setAttribute('aria-label', 'Outcome metrics');
        var thead = el('thead');
        var tr = el('tr');
        tr.appendChild(el('th', '', 'Metric'));
        tr.appendChild(el('th', '', 'Value'));
        thead.appendChild(tr);
        table.appendChild(thead);

        var tbody = el('tbody');
        d.metrics.forEach(function (m) {
          var row = el('tr');
          var labelTd = el('td');
          labelTd.textContent = m.label;
          var valueTd = el('td');
          var valSpan = el('span', 'placeholder');
          valSpan.textContent = m.value;
          valueTd.appendChild(valSpan);
          row.appendChild(labelTd);
          row.appendChild(valueTd);
          tbody.appendChild(row);
        });
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        wrap.appendChild(tableWrap);

        container.appendChild(section(nextBg(), wrap));
      })();

      // ------------------------------------------------------------------
      // 14. Lessons Learned
      // ------------------------------------------------------------------
      (function () {
        var d = data.lessonsLearned;
        var wrap = el('div');
        wrap.appendChild(eyebrow('Reflections'));
        wrap.appendChild(sectionTitle(d.title));

        var grid = el('div', 'grid sm:grid-cols-2 gap-5 mt-2');
        d.items.forEach(function (item) {
          var card = el('div', 'lesson-card');
          var area = el('p',
            'text-xs font-bold uppercase tracking-widest mb-2',
            '');
          area.style.color = 'var(--color-accent)';
          area.textContent = item.area;
          var lesson = el('p', 'text-[#4B5563] text-sm');
          lesson.style.lineHeight = 'var(--leading-loose)';
          lesson.textContent = item.lesson;
          card.appendChild(area);
          card.appendChild(lesson);
          grid.appendChild(card);
        });
        wrap.appendChild(grid);
        container.appendChild(section(nextBg(), wrap));
      })();

      // ------------------------------------------------------------------
      // Init scroll reveal
      // ------------------------------------------------------------------
      if (window.initReveal) {
        window.initReveal();
      }

    });
  </script>

</body>
</html>
